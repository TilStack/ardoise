name: ardoise
description: "L'Ardoise — le cahier de crédit du boutiquier, sans le cahier."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  intl: any
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/ardoise_icon.png
  adaptive_icon_background: "#EA580C"
  adaptive_icon_foreground: assets/logo/ardoise_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo/ardoise_icon.png
