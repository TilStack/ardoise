# Déploiement de l'API sur Render (offre gratuite) à partir de ce dépôt.
# Render : New > Blueprint > choisir ce dépôt. Les variables « sync: false » sont à saisir
# dans l'interface Render (jamais ici). Voir docs/DEPLOY.md.
services:
  - type: web
    name: ardoise-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Base PostgreSQL (ex. Neon) : adresse de connexion fournie par le fournisseur.
      - key: DATABASE_URL
        sync: false
      # Générés automatiquement par Render (aléatoires, jamais visibles dans le dépôt).
      - key: JWT_SECRET
        generateValue: true
      # Valeur provisoire aléatoire : à remplacer par le secret du webhook NotchPay (hsk_…)
      # une fois le webhook créé sur l'adresse de l'API.
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: notchpay
      # Clé publique NotchPay : pk_test_… pour le test fermé, pk_… de production ensuite.
      - key: NOTCHPAY_PUBLIC_KEY
        sync: false
      # Adresse publique de l'API + /p. À corriger si Render attribue un autre nom.
      - key: PUBLIC_PAY_URL
        value: https://ardoise-api-nf2c.onrender.com/p
      # Numéros des testeurs avec leur code fixe : +237XXXXXXXXX:123456,+237YYYYYYYYY:654321
      - key: OTP_TEST_NUMBERS
        sync: false
      - key: ENABLE_JOBS
        value: "true"
